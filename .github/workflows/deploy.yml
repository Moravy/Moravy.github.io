name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so date-scheduled blog posts go live on their publishedAt date
  # with no manual push. 18:00 UTC is about 6am in Auckland.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages, and OIDC for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
